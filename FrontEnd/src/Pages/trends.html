<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP — Themes & Trends</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<script src="../assets/data.js"></script><script src="../assets/api.js"></script><script src="../assets/app.js"></script><script>document.write(shell("Themes & Trends","Themes & Trends"))</script>
<script>
const c=document.querySelector(".content");
c.innerHTML=`
<div class="page-head"><div><div class="eyebrow">AI THEME INTELLIGENCE</div><h1>Themes & trends</h1><p>See which topics are growing, shrinking or spiking, then drill into the feedback behind each theme.</p></div><div class="actions"><select class="select"><option>Last 30 days</option><option>Last 7 days</option><option>Last 90 days</option></select><button class="btn" data-toast="Trend data exported">${icon("download")} Export</button></div></div>
<div class="grid stats">
 <div class="card stat-card"><div class="stat-top"><span class="stat-label">ACTIVE THEMES</span><div class="stat-icon">${icon("trends")}</div></div><div class="stat-value">24</div><div class="stat-meta">5 new this month</div></div>
 <div class="card stat-card"><div class="stat-top"><span class="stat-label">SPIKING THEMES</span><div class="stat-icon" style="color:var(--red);background:var(--red-soft)">↗</div></div><div class="stat-value">6</div><div class="stat-meta"><span class="negative-text">+18%</span> average increase</div></div>
 <div class="card stat-card"><div class="stat-top"><span class="stat-label">FASTEST GROWING</span><div class="stat-icon" style="color:var(--green);background:var(--green-soft)">↑</div></div><div class="stat-value text">SSO</div><div class="stat-meta"><span class="negative-text">+31%</span> vs previous period</div></div>
 <div class="card stat-card"><div class="stat-top"><span class="stat-label">AI CONFIDENCE</span><div class="stat-icon">${icon("spark")}</div></div><div class="stat-value">94.8%</div><div class="stat-meta">Across classified items</div></div>
</div>
<div class="grid two-col">
 <div class="card"><div class="card-head"><div><h2>Theme volume over time</h2><p>Combined volume across top themes</p></div></div><div class="card-body"><div class="chart-area"><div class="grid-lines"><i></i><i></i><i></i><i></i><i></i></div><div class="bars" id="trendBars"></div><div class="x-labels"><span>Jul 14</span><span>Jul 21</span><span>Jul 28</span><span>Aug 4</span><span>Aug 11</span></div></div></div>
 <div class="card"><div class="card-head"><div><h2>Theme ranking</h2><p>Volume, movement and sentiment</p></div></div><div class="card-body"><div class="theme-list">${LOOP_DATA.themes.map((t,i)=>`<div class="theme-item"><div class="theme-main"><div class="theme-name"><span class="rank">${i+1}</span>${t.name}</div><span class="theme-count">${t.count}</span></div><div class="theme-sub"><span>${t.description}</span><span class="${t.change>=20?'negative-text':'positive-text'}">${t.change>0?"+":""}${t.change}%</span></div><div class="theme-meter"><i style="width:${100-i*13}%"></i></div></div>`).join("")}</div></div></div>
</div>
<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Trend signals</h2><p>AI-detected movement compared with the previous period</p></div></div><div class="table-wrap"><table class="table trend-table"><thead><tr><th>Theme</th><th>Current volume</th><th>Change</th><th>Signal</th><th>Interpretation</th><th></th></tr></thead><tbody>
${LOOP_DATA.themes.map(t=>`<tr><td><strong style="color:var(--text)">${t.name}</strong></td><td>${t.count}</td><td class="${t.change>=20?'spike':'up'}">+${t.change}%</td><td>${t.change>=20?'<span class="badge negative">Spiking</span>':'<span class="badge positive">Growing</span>'}</td><td>${t.change>=20?'Needs product attention':'Monitor and continue tracking'}</td><td><a href="inbox.html" class="head-link">View feedback →</a></td></tr>`).join("")}
</tbody></table></div></div>
<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Emerging insights</h2><p>Patterns worth discussing in the next product review</p></div><a class="head-link" href="ask.html">Ask LOOP →</a></div><div class="card-body"><div class="insight-grid">
<div class="insight"><div class="insight-label">Emerging risk</div><strong>Onboarding friction</strong>Mentions are up 28%. Team invites and unclear setup steps dominate negative feedback.</div>
<div class="insight"><div class="insight-label">Enterprise signal</div><strong>SSO demand</strong>SSO is the fastest-growing theme at +31%, repeatedly appearing in sales conversations.</div>
<div class="insight"><div class="insight-label">Positive signal</div><strong>Performance improvements</strong>Positive performance mentions are up 16% after the latest dashboard release.</div>
</div></div></div>`;
const vals=[34,41,39,47,53,50,61,57,69,65,76,72,84,79,92,89,104,95,111,108,121,115,130,123,137,132,146,151];
document.querySelector("#trendBars").innerHTML=vals.map(v=>`<div class="bar-col"><div class="bar" style="height:${(v/160)*100}%"></div></div>`).join("");
</script></body></html>
