<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP — Feedback Inbox</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<script src="../assets/data.js"></script><script src="../assets/api.js"></script><script src="../assets/app.js"></script><script>document.write(shell("Feedback Inbox","Feedback Inbox"))</script>
<script>
const c=document.querySelector(".content");
c.innerHTML=`
<div class="page-head"><div><div class="eyebrow">FEEDBACK MANAGEMENT</div><h1>Feedback inbox</h1><p>Search, filter and triage every customer signal. Classifications are stored with each feedback record.</p></div><div class="actions"><button class="btn" onclick="openModal('importModal')">${icon("upload")} Import CSV</button><button class="btn btn-primary" onclick="openModal('addModal')">${icon("plus")} Add feedback</button></div></div>
<div class="card"><div class="toolbar">
 <div class="search-wrap">${icon("search")}<input id="q" class="input" placeholder="Search feedback, themes or feature areas..."></div>
 <select id="channel" class="select"><option value="">All channels</option><option>Support ticket</option><option>App store</option><option>NPS survey</option><option>Sales call</option><option>Community</option></select>
 <select id="sentiment" class="select"><option value="">All sentiment</option><option value="positive">Positive</option><option value="neutral">Neutral</option><option value="negative">Negative</option></select>
 <select id="theme" class="select"><option value="">All themes</option>${LOOP_DATA.themes.map(t=>`<option>${t.name}</option>`).join("")}</select>
 <select id="status" class="select"><option value="">All status</option><option>NEW</option><option>REVIEWED</option><option>ACTIONED</option></select>
</div>
<div class="table-wrap"><table class="table"><thead><tr><th>Customer feedback</th><th>Channel</th><th>Sentiment</th><th>Theme</th><th>Feature area</th><th>Status</th><th>Received</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><span id="count"></span><div class="page-buttons"><button>‹</button><button class="current">1</button><button>2</button><button>3</button><button>›</button></div></div></div>
<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Ingestion channels</h2><p>Seeded channel adapters are ready for API integration.</p></div><span class="badge positive">● Ready</span></div><div class="card-body"><div class="insight-grid">
 <div class="insight"><div class="insight-label">Support</div><strong>Support tickets</strong>Incoming support feedback can be normalized into the common feedback schema.</div>
 <div class="insight"><div class="insight-label">Reviews</div><strong>App-store reviews</strong>Review text, rating and timestamp can be mapped into feedback items.</div>
 <div class="insight"><div class="insight-label">Surveys</div><strong>NPS / CSAT</strong>Free-text survey responses are ready for classification and theme assignment.</div>
 </div></div></div>
<div class="modal-backdrop" id="importModal"><div class="modal"><div class="modal-head"><h3>Import feedback</h3><button class="icon-btn" data-close="importModal">${icon("close")}</button></div><div class="modal-body"><div class="field"><label>CSV FILE</label><input class="input" type="file" accept=".csv"></div><div class="alert" style="margin-top:13px">The backend should validate required columns, reject malformed rows, store the workspaceId and queue new items for AI classification.</div></div><div class="modal-foot"><button class="btn" data-close="importModal">Cancel</button><button class="btn btn-primary" onclick="closeModal('importModal');toast('Import submitted for processing')">Start import</button></div></div></div>
<div class="modal-backdrop" id="addModal"><div class="modal"><div class="modal-head"><h3>Add feedback</h3><button class="icon-btn" data-close="addModal">${icon("close")}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>CHANNEL</label><select class="select"><option>Support ticket</option><option>App store</option><option>NPS survey</option><option>Sales call</option><option>Community</option></select></div><div class="field"><label>FEATURE AREA</label><input class="input" placeholder="e.g. Onboarding"></div><div class="field full"><label>FEEDBACK</label><textarea class="textarea" rows="5" placeholder="Paste customer feedback..."></textarea></div></div></div><div class="modal-foot"><button class="btn" data-close="addModal">Cancel</button><button class="btn btn-primary" onclick="closeModal('addModal');toast('Feedback submitted for classification')">Save feedback</button></div></div></div>`;
function paint(rows){
 document.querySelector("#rows").innerHTML=rows.map(f=>`<tr>
 <td><div class="feedback-cell"><div class="feedback-title">${esc(f.text)}</div><div class="feedback-meta">${f.id} · ${f.date} ${f.time}</div></div></td>
 <td>${esc(f.channel)}</td><td>${sentimentBadge(f.sentiment)}</td><td><span class="badge neutral">${esc(f.theme)}</span></td><td>${esc(f.feature)}</td>
 <td><select class="select" style="min-width:103px;height:30px;min-height:30px;padding:0 7px;font-size:9px" onchange="changeStatus('${f.id}',this.value)"><option ${f.status==="NEW"?"selected":""}>NEW</option><option ${f.status==="REVIEWED"?"selected":""}>REVIEWED</option><option ${f.status==="ACTIONED"?"selected":""}>ACTIONED</option></select></td>
 <td>${f.date}</td><td><button class="icon-btn" onclick="viewFeedback('${f.id}')" title="View details">•••</button></td></tr>`).join("");
 document.querySelector("#count").textContent=`Showing ${rows.length} of 1,284 feedback items`;
}
function filter(){
 const q=document.querySelector("#q").value.toLowerCase(),ch=document.querySelector("#channel").value,se=document.querySelector("#sentiment").value,th=document.querySelector("#theme").value,st=document.querySelector("#status").value;
 paint(LOOP_DATA.feedback.filter(f=>(!q||`${f.text} ${f.theme} ${f.feature}`.toLowerCase().includes(q))&&(!ch||f.channel===ch)&&(!se||f.sentiment===se)&&(!th||f.theme===th)&&(!st||f.status===st)));
}
function changeStatus(id,value){const f=LOOP_DATA.feedback.find(x=>x.id===id);if(f)f.status=value;toast(`${id} moved to ${value}`)}
function viewFeedback(id){const f=LOOP_DATA.feedback.find(x=>x.id===id);if(!f)return;openModal("detailModal");document.querySelector("#detailContent").innerHTML=`<div class="field"><label>FEEDBACK ID</label><div style="font-weight:800">${f.id}</div></div><div class="field" style="margin-top:14px"><label>FEEDBACK</label><div style="font-size:12px;line-height:1.7">${esc(f.text)}</div></div><div class="form-grid" style="margin-top:15px"><div><label>CHANNEL</label><div style="margin-top:5px">${f.channel}</div></div><div><label>SENTIMENT</label><div style="margin-top:5px">${sentimentBadge(f.sentiment)} <span style="font-size:10px;color:var(--muted)">score ${f.score}</span></div></div><div><label>THEME</label><div style="margin-top:5px">${f.theme}</div></div><div><label>FEATURE AREA</label><div style="margin-top:5px">${f.feature}</div></div></div>`}
["q","channel","sentiment","theme","status"].forEach(id=>document.querySelector("#"+id).addEventListener("input",filter));
paint(LOOP_DATA.feedback);
</script>
<div class="modal-backdrop" id="detailModal"><div class="modal"><div class="modal-head"><h3>Feedback details</h3><button class="icon-btn" data-close="detailModal">${icon("close")}</button></div><div class="modal-body" id="detailContent"></div><div class="modal-foot"><button class="btn" data-close="detailModal">Close</button></div></div></div>
</body></html>
