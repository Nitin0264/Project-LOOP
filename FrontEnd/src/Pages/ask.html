<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP — Ask LOOP</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<script src="../assets/data.js"></script><script src="../assets/api.js"></script><script src="../assets/app.js"></script><script>document.write(shell("Ask LOOP","Ask LOOP"))</script>
<script>
const c=document.querySelector(".content");
c.innerHTML=`
<div class="page-head"><div><div class="eyebrow">GROUNDED AI</div><h1>Ask LOOP</h1><p>Ask questions in plain English. Every answer should be grounded in the feedback your workspace actually contains.</p></div><div class="actions"><span class="badge positive">● Grounding required</span></div></div>
<div class="card chat-shell">
 <aside class="chat-sidebar"><h3>Suggested questions</h3><div class="prompt-list">
  <button class="prompt" data-q="What are users saying about onboarding?">What are users saying about onboarding?</button>
  <button class="prompt" data-q="What are the top negative themes?">What are the top negative themes?</button>
  <button class="prompt" data-q="Which themes are spiking this month?">Which themes are spiking?</button>
  <button class="prompt" data-q="What should product improve next?">What should product improve next?</button>
  <button class="prompt" data-q="How is sentiment changing?">How is sentiment changing?</button>
 </div>
 <div style="margin-top:25px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff"><div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px">Grounding</div><div style="font-size:10px;color:var(--text-2);margin-top:5px;line-height:1.5">Answers are expected to cite the feedback records used as evidence.</div></div>
 </aside>
 <section class="chat-main"><div class="messages" id="messages">
  <div class="message ai"><div class="bubble"><strong>LOOP AI</strong><br>Ask me anything about customer feedback. I’ll retrieve the most relevant feedback first and show the evidence used for the answer.</div><div class="message-meta">LOOP · Grounded answer mode</div></div>
  <div class="message user"><div class="bubble">What are users saying about onboarding?</div><div class="message-meta">You · Just now</div></div>
  <div class="message ai"><div class="bubble">Onboarding is one of the clearest current friction points. There are <strong>243 mentions</strong>, up <strong>28%</strong> versus the previous period. The strongest negative pattern is around team invitations and unclear setup steps.</div><div class="message-meta">LOOP AI · 8 relevant feedback items</div><div class="sources"><strong>Evidence used</strong><div class="source-row">FB-1048 · “Onboarding took forever — I couldn't figure out how to invite my team.”</div><div class="source-row">FB-1040 · “Setup is clearer than last month, but the invite flow still feels hidden.”</div></div></div>
 </div>
 <form class="chat-composer" id="askForm"><input id="question" class="input" placeholder="Ask about your customer feedback..." autocomplete="off"><button class="btn btn-primary">${icon("spark")} Ask LOOP</button></form>
 </section>
</div>`;
async function submitQuestion(q){
 const m=document.querySelector("#messages");
 m.insertAdjacentHTML("beforeend",`<div class="message user"><div class="bubble">${esc(q)}</div><div class="message-meta">You · Just now</div></div>`);
 document.querySelector("#question").value="";
 m.insertAdjacentHTML("beforeend",`<div class="message ai"><div class="bubble"><span style="color:var(--muted)">LOOP is retrieving relevant feedback…</span></div></div>`);
 m.scrollTop=m.scrollHeight;
 /* Backend integration point: LOOP_API.post('/insights/ask',{question:q}) */
 try{
   if(localStorage.getItem("LOOP_USE_BACKEND")==="true"){
     const data=await LOOP_API.post("/insights/ask",{question:q});
     m.lastElementChild.outerHTML=`<div class="message ai"><div class="bubble">${esc(data.answer||"No answer returned.")}</div><div class="message-meta">LOOP AI</div></div>`;
   }else{
     setTimeout(()=>{m.lastElementChild.outerHTML=`<div class="message ai"><div class="bubble">This question is ready for the grounded retrieval endpoint. Connect <strong>POST /api/insights/ask</strong> to return the answer and its source feedback records.</div><div class="message-meta">LOOP AI · Backend integration point</div><div class="sources"><strong>Required response</strong><div class="source-row">answer · confidence · source feedback IDs</div></div></div>`;m.scrollTop=m.scrollHeight},500);
   }
 }catch(err){m.lastElementChild.outerHTML=`<div class="message ai"><div class="bubble" style="color:var(--red)">Unable to retrieve an answer right now. Please try again.</div></div>`}
}
document.querySelector("#askForm").addEventListener("submit",e=>{e.preventDefault();const q=document.querySelector("#question").value.trim();if(q)submitQuestion(q)});
document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>submitQuestion(b.dataset.q)));
</script></body></html>
