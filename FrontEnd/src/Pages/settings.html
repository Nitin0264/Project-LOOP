<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP — Settings</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<script src="../assets/api.js"></script><script src="../assets/app.js"></script><script>document.write(shell("Settings","Settings"))</script>
<script>
document.querySelector(".content").innerHTML=`
<div class="page-head"><div><div class="eyebrow">WORKSPACE CONTROL</div><h1>Settings</h1><p>Manage workspace details, members, roles and the frontend connection to your API.</p></div></div>
<div class="settings-tabs"><button class="active">Workspace</button><button>Members</button><button>Profile</button><button>Security</button></div>
<div class="grid two-col">
 <div class="card"><div class="card-head"><div><h2>Workspace details</h2><p>Information shown across your LOOP workspace.</p></div></div><div class="card-body"><div class="form-grid">
  <div class="field"><label>WORKSPACE NAME</label><input class="input" value="Acme Inc."></div>
  <div class="field"><label>WORKSPACE SLUG</label><input class="input" value="acme-inc"></div>
  <div class="field full"><label>DESCRIPTION</label><textarea class="textarea" rows="4">Customer feedback intelligence workspace for product, support and leadership.</textarea></div>
 </div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-toast="Workspace settings saved">Save changes</button></div></div></div>
 <div class="card"><div class="card-head"><div><h2>Team members</h2><p>3 members · role-based access control</p></div><button class="btn btn-primary" data-toast="Invite flow opened">${icon("plus")} Invite</button></div><div class="card-body">
 ${[["Ainul Haq","admin@acme.com","Admin","AH"],["Ananya Sharma","ananya@acme.com","Analyst","AS"],["Rahul Verma","rahul@acme.com","Viewer","RV"]].map(m=>`<div class="member"><div class="member-left"><div class="avatar">${m[3]}</div><div><strong>${m[0]}</strong><small>${m[1]}</small></div></div><span class="badge ${m[2]==="Admin"?"positive":m[2]==="Analyst"?"reviewed":"neutral"}">${m[2]}</span></div>`).join("")}
 </div></div>
 <div class="card"><div class="card-head"><div><h2>Role permissions</h2><p>Server-side authorization remains authoritative.</p></div></div><div class="card-body">
  <div class="member"><div><strong>Admin</strong><small>Manage workspace, members, feedback, themes and reports.</small></div><span class="badge positive">Full access</span></div>
  <div class="member"><div><strong>Analyst</strong><small>Ingest, classify, triage and manage feedback and insights.</small></div><span class="badge reviewed">Manage data</span></div>
  <div class="member"><div><strong>Viewer</strong><small>Read-only access to feedback, analytics and reports.</small></div><span class="badge neutral">Read only</span></div>
  <div class="alert" style="margin-top:14px">Every API query must be scoped to the authenticated workspace. UI-level hiding is not a security control.</div>
 </div></div>
 <div class="card"><div class="card-head"><div><h2>API connection</h2><p>Set the backend URL when your teammate's API is running.</p></div><span class="badge positive">Frontend ready</span></div><div class="card-body"><div class="field"><label>API BASE URL</label><input id="apiUrl" class="input" value="${LOOP_API.baseUrl}"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" id="saveApi">Save API URL</button><button class="btn" id="testApi">Test connection</button></div><div style="margin-top:10px;color:var(--muted);font-size:9px">Example: http://localhost:3000/api or your deployed API URL.</div></div></div>
</div>`;
document.getElementById("saveApi").onclick=()=>{LOOP_API.setBaseUrl(document.getElementById("apiUrl").value);toast("API base URL saved")};
document.getElementById("testApi").onclick=async()=>{try{await LOOP_API.get("/health");toast("Backend connection successful")}catch(e){toast("Backend health endpoint is not reachable","error")}};
</script></body></html>
